name: 'JWTop - JWT Operations Toolkit'
description:
  'Install and run jwtop for JWT decoding, verification, creation, signing,
  cracking, and exploit testing'
author: 'cerberauth'

branding:
  icon: 'shield'
  color: 'blue'

inputs:
  token:
    description:
      'GitHub token used to fetch release information from the jwtop repository.'
    required: false
    default: ${{ github.token }}
  version:
    description:
      'Version of jwtop to install (e.g. v0.2.0). Defaults to latest.'
    required: false
    default: 'latest'
  command:
    description:
      'jwtop command to run (decode, verify, create, sign, crack, exploit). If
      omitted, only installs jwtop.'
    required: false
    default: ''
  args:
    description:
      'Arguments to pass to the jwtop command (e.g. "eyJ... --secret mysecret").'
    required: false
    default: ''
  telemetry:
    description:
      'jwtop collects fully anonymized usage data to help improve the tool. You
      can disable it by setting this to false.'
    required: false
    default: 'true'
  comment:
    description:
      'When the workflow runs for a pull request and the command supports it
      (currently `crack`), post/update a PR comment with the full scan report
      (every finding, not just vulnerable ones), while the terminal log keeps
      showing the usual summary. Requires the token to have pull-requests: write
      (and issues: write) permission; if it does not, the step logs a warning
      instead of failing. Set to false to disable.'
    required: false
    default: 'true'
  output-format:
    description:
      'For commands that support it (currently `crack`), write the full report
      to a file in this format: json, yaml, jsonl, sarif, markdown, html, or
      terminal. The file path is exposed as the report-path output (e.g. to
      upload as a workflow artifact or feed sarif to
      github/codeql-action/upload-sarif). Has no effect if `args` already sets
      --output.'
    required: false
    default: ''
  output-path:
    description:
      'File path for output-format. Defaults to a generated path under
      RUNNER_TEMP.'
    required: false
    default: ''
  report-url:
    description:
      'For commands that support it (currently `crack`), HTTP endpoint to POST
      the full report to. Has no effect if `args` already sets --report-url.'
    required: false
    default: ''
  report-format:
    description:
      'Format for report-url: json, yaml, jsonl, sarif, markdown, html.'
    required: false
    default: ''
  report-headers:
    description:
      'Extra HTTP headers for report-url, one "Key: Value" (or "Key=Value") pair
      per line, e.g. for an authorization token.'
    required: false
    default: ''
  show-all-findings:
    description:
      'For commands that support it (currently `crack`), show every finding on
      the terminal, not just vulnerable ones (files/report-url always get every
      finding regardless of this).'
    required: false
    default: 'false'
  no-color:
    description: 'Disable ANSI colors in terminal output.'
    required: false
    default: 'false'
  quiet:
    description: 'Suppress terminal display of the report.'
    required: false
    default: 'false'

outputs:
  output:
    description:
      'Stdout from the jwtop command (only set when command is provided).'
  report-path:
    description:
      'Path to the full report file, when output-format/output-path was set
      (directly or via `args`).'
  jwtop-path:
    description: 'Directory where jwtop binary is located.'

runs:
  using: node24
  main: dist/index.js
