name: Continuous Integration

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  packages: read

env:
  WEAK_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U # gitleaks:allow
  STRONG_JWT: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiJqd3RvcC1hY3Rpb24tY2kiLCJleHAiOjQxMDI0NDQ4MDB9.2eNQY4sESo7k4VWTTknC9Z3zY9ssKnDTJDNvJZLC8K0 # gitleaks:allow

jobs:
  test-typescript:
    name: TypeScript Tests
    uses: cerberauth/ci/.github/workflows/action-ci.yml@main

  test-action:
    name: GitHub Actions Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Install jwtop (install only)
        id: test-install
        uses: ./
        with:
          version: latest

      - name: Verify jwtop is on PATH
        id: verify
        run: jwtop --help

      - name: Decode a JWT
        id: test-decode
        uses: ./
        with:
          version: latest
          command: decode
          args: ${{ env.WEAK_JWT }}

      - name: Print decoded output
        id: output
        env:
          DECODED: ${{ steps.test-decode.outputs.output }}
        run: echo "$DECODED"

  test-action-crack:
    name: GitHub Actions Test (crack gate and PR comment)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Crack a weak token
        id: crack-weak
        continue-on-error: true
        uses: ./
        with:
          version: latest
          command: crack
          args: ${{ env.WEAK_JWT }}
          scan-id: demo-with-findings

      - name: Check the step failed on the vulnerable token
        if: ${{ steps.crack-weak.outcome != 'failure' }}
        run: |
          echo "Expected crack to fail on a token signed with a weak secret"
          exit 1

      - name: Crack a strong token
        id: crack-strong
        uses: ./
        with:
          version: latest
          command: crack
          args: ${{ env.STRONG_JWT }}
          scan-id: demo-no-findings

  test-action-reports:
    name: GitHub Actions Test (report ${{ matrix.format }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        format: [json, yaml, jsonl, sarif, markdown, html, terminal]

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v7

      - name: Crack a token and write a ${{ matrix.format }} report
        id: test-crack
        uses: ./
        with:
          version: latest
          command: crack
          args: ${{ env.STRONG_JWT }}
          output-format: ${{ matrix.format }}
          comment: false

      - name: Verify report file was written
        id: verify
        env:
          REPORT_PATH: ${{ steps.test-crack.outputs.report-path }}
        run: test -s "$REPORT_PATH"

      - name: Upload report as an artifact
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: jwtop-crack-report-${{ matrix.format }}
          path: ${{ steps.test-crack.outputs.report-path }}
